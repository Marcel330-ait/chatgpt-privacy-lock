<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Privacy Lock</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="cpl-popup">
    <main>
      <header class="cpl-popup-header">
        <img class="cpl-brand-icon" src="icons/icon48.png" width="42" height="42" alt="" />
        <div class="cpl-brand-copy">
          <span class="cpl-kicker" data-i18n="privateByDesign">Private by design</span>
          <h1 data-i18n="popupTitle">Privacy Lock</h1>
          <p data-i18n="popupSubtitle">Keep sidebar details out of sight.</p>
        </div>
      </header>

      <form id="privacy-form">
        <section class="cpl-status-card" id="status-card" data-state="off">
          <div class="cpl-status-symbol" aria-hidden="true"><span class="cpl-lock-glyph"></span></div>
          <label class="cpl-toggle-row" for="enabled">
            <span class="cpl-status-copy">
              <small data-i18n="protectionStatus">Protection status</small>
              <strong id="status-text">Off</strong>
            </span>
            <input id="enabled" type="checkbox" role="switch" />
            <span class="cpl-toggle" aria-hidden="true"></span>
          </label>
        </section>

        <section class="cpl-panel">
          <div class="cpl-panel-heading">
            <div>
              <h2 data-i18n="protectWhat">Hide these sidebar areas</h2>
              <p data-i18n="protectWhatHelp">New chat and the current conversation stay usable.</p>
            </div>
            <span class="cpl-count-pill" id="area-count">5/5</span>
          </div>

          <fieldset class="cpl-area-fieldset">
            <legend class="cpl-visually-hidden" data-i18n="protectWhat">Hide these sidebar areas</legend>
            <label class="cpl-area-option"><input type="checkbox" data-area="search" /><span class="cpl-checkbox" aria-hidden="true"></span><span data-i18n="areaSearch">Search chats</span></label>
            <label class="cpl-area-option"><input type="checkbox" data-area="library" /><span class="cpl-checkbox" aria-hidden="true"></span><span data-i18n="areaLibrary">Library</span></label>
            <label class="cpl-area-option"><input type="checkbox" data-area="pinned" /><span class="cpl-checkbox" aria-hidden="true"></span><span data-i18n="areaPinned">Pinned chats</span></label>
            <label class="cpl-area-option"><input type="checkbox" data-area="projects" /><span class="cpl-checkbox" aria-hidden="true"></span><span data-i18n="areaProjects">Projects</span></label>
            <label class="cpl-area-option cpl-area-option-wide"><input type="checkbox" data-area="chats" /><span class="cpl-checkbox" aria-hidden="true"></span><span data-i18n="areaChats">Previous chats</span></label>
          </fieldset>
        </section>

        <section class="cpl-panel cpl-settings-panel">
          <label class="cpl-field-label" for="pin">
            <span id="pin-label">Set a PIN</span>
            <input
              id="pin"
              type="password"
              inputmode="numeric"
              autocomplete="off"
              maxlength="32"
              placeholder="At least 4 characters"
              data-i18n-placeholder="pinPlaceholder"
            />
            <small id="pin-help">Required before you can enable protection.</small>
          </label>

          <label class="cpl-field-label" for="language">
            <span data-i18n="languageLabel">Language</span>
            <select id="language">
              <option value="auto" data-i18n="languageAuto">Auto</option>
              <option value="zh_CN" data-i18n="languageChinese">中文</option>
              <option value="en" data-i18n="languageEnglish">English</option>
            </select>
            <small data-i18n="languageHelp">Auto follows Chrome's language.</small>
          </label>

          <label class="cpl-field-label" for="unlock-duration">
            <span data-i18n="unlockDuration">Unlock time</span>
            <input id="unlock-duration" type="number" min="1" max="120" step="1" value="5" inputmode="numeric" />
            <small data-i18n="unlockDurationHelp">1–120 minutes.</small>
          </label>

          <label class="cpl-field-label" for="unlock-scope">
            <span data-i18n="unlockScope">Unlock scope</span>
            <select id="unlock-scope">
              <option value="item" data-i18n="unlockScopeItem">Clicked item only</option>
              <option value="all" data-i18n="unlockScopeAll">Entire sidebar</option>
            </select>
            <small data-i18n="unlockScopeHelp">Choose what a correct PIN reveals.</small>
          </label>

          <fieldset class="cpl-color-fieldset">
            <legend data-i18n="accentColor">Mask glass tint</legend>
            <label class="cpl-color-option">
              <input type="radio" name="accent-theme" value="indigo" checked />
              <span class="cpl-color-swatch cpl-color-indigo" aria-hidden="true"></span>
              <span data-i18n="colorIndigo">Indigo</span>
            </label>
            <label class="cpl-color-option">
              <input type="radio" name="accent-theme" value="emerald" />
              <span class="cpl-color-swatch cpl-color-emerald" aria-hidden="true"></span>
              <span data-i18n="colorEmerald">Emerald</span>
            </label>
            <label class="cpl-color-option">
              <input type="radio" name="accent-theme" value="rose" />
              <span class="cpl-color-swatch cpl-color-rose" aria-hidden="true"></span>
              <span data-i18n="colorRose">Rose</span>
            </label>
          </fieldset>
        </section>

        <p class="cpl-popup-error" id="popup-error" aria-live="polite"></p>
        <div class="cpl-action-row">
          <button class="cpl-lock-now" id="lock-now" type="button">
            <span class="cpl-button-lock" aria-hidden="true"></span>
            <span data-i18n="lockNow">Lock Now</span>
          </button>
          <button class="cpl-save-button" type="submit" data-i18n="saveSettings">Save settings</button>
        </div>
      </form>

      <footer class="cpl-popup-footer">
        <div class="cpl-footer-links">
          <a href="https://github.com/Marcel330-ait/chatgpt-privacy-lock/issues/new" target="_blank" rel="noreferrer" data-i18n="sendFeedback">Send feedback</a>
          <span aria-hidden="true">•</span>
          <a href="https://chromewebstore.google.com/detail/chatgpt-privacy-lock/mdkolhebllobgibogljlmedndajncdeg" target="_blank" rel="noreferrer" data-i18n="rateHonestly">Leave a review</a>
        </div>
        <p><span data-i18n="localOnly">Settings and PIN protection stay on this device.</span> <span id="version-text"></span></p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
